# Fastfood Kitchen — 宿主机 Nginx 配置模板
# 用法：
#   1. 将域名证书放到 /etc/nginx/certs/ 下（或改用 certbot）
#   2. 复制为 /etc/nginx/conf.d/fastfood-kitchen.conf 并替换 <你的域名>
#   3. nginx -t && systemctl reload nginx
#
# 容器端口：web-admin = 4173，api = 3000（容器内部网络，Nginx 直连容器 IP
# 或先做 docker compose 端口映射 127.0.0.1:4173/3000 后走 localhost）

upstream web_admin {
    server 127.0.0.1:4173;
}

upstream api_server {
    server 127.0.0.1:3000;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name <你的域名>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name <你的域名>;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # Web Admin（Next.js SSR）
    location / {
        proxy_pass http://web_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API
    location /api/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
